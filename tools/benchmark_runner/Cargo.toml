[package]
name = "goldsnnail-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
anyhow = "1.0"
toml = "0.8"
colored = "2.1"
zip = "2.2"

[dev-dependencies]
tempfile = "3.10"

[package]
name = "goldworm-app"
version = "0.3.0"
edition = "2021"
description = "GoldWorm Desktop App"
authors = ["GoldWorm Research Team"]
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", default-features = false, features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
goldworm = { path = "../../" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
wgpu = { version = "22", optional = true }

[features]
default = []
vulkan = ["dep:wgpu"]
cuda = []

[package.metadata]

